name: Sync complete Loon rules
on:
  schedule:
    - cron: '47 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-loon-direct.yml'
      - 'scripts/**'
      - 'custom/**'
      - 'Bybit.list'
permissions:
  contents: write
concurrency:
  group: loon-direct-rules
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Test deduplication and category coverage
        run: |
          python3 - <<'PY'
          from scripts.build_rules import CATEGORIES, ORDER, compact, Coverage, cidr
          assert set(CATEGORIES).issubset(ORDER)
          assert compact(['DOMAIN-SUFFIX,example.com','DOMAIN,a.example.com']) == ['DOMAIN-SUFFIX,example.com']
          c=Coverage()
          c.add('DOMAIN-SUFFIX,a.example.com')
          assert not c.covered('DOMAIN-SUFFIX,example.com')
          assert c.covered('DOMAIN,b.a.example.com')
          assert not c.covered('DOMAIN,notexample.com')
          assert cidr('2001:db8::/32',True)=='IP-CIDR6,2001:db8::/32,no-resolve'
          PY
      - name: Download validate and build complete rules
        run: python3 scripts/build_rules.py
      - name: Publish validated rules
        shell: bash
        run: |
          git add -- rules ordered ChinaDirect.list LANDirect.list Loon-Full.conf Loon-Local-Routing.conf sources-and-stats.json FULL-GUIDE.txt 使用说明.txt
          if git diff --cached --quiet; then
            echo 'No rule changes' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update complete Loon rules and deduplication report'
          git push origin HEAD:main
